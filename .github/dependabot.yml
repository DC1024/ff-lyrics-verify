version: 2
updates:
  # 每周一次而非每天：FF 依赖十几个包，每天开 PR 会淹没真正需要看的变更
  - package-ecosystem: "nuget"
    directory: "/src/FluentFlyout.Lyrics"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    # 这几项与 FF 主工程必须保持一致，不要单独升
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore.Sqlite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nuget"
    directory: "/src/FluentFlyout.Lyrics.Probe"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Actions 自身也要跟版本，否则 v3 -> v4 的弃用会突然打挂流水线
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"