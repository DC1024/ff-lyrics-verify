name: verify

# 触发条件：
#   - 推送到 main（PR 合并后）
#   - 任何 PR 触及 src/
#   - 手动触发（可指定是否跑 ARM64）
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/**']
  pull_request:
    paths: ['src/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      run_arm64:
        description: '同时验证 ARM64'
        type: boolean
        default: true

# 同一分支只保留最新一次运行，避免排队
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────
  # J1：核心探针 —— 验证 Lyricify 在 net10 下的行为
  # 判定门槛：9/9 全部 PASS，任一项 FAIL 即阻断
  # ─────────────────────────────────────────────────────────────
  probe:
    name: J1 兼容性探针
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 缓存 NuGet 可把还原时间从 ~60s 降到 ~10s
      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原
        working-directory: src/FluentFlyout.Lyrics.Probe
        run: dotnet restore

      - name: 编译（警告视为错误）
        working-directory: src/FluentFlyout.Lyrics.Probe
        run: dotnet build -c Release --no-restore -warnaserror

      # 运行探针。程序返回码即判定结果：0=全通过，1=有失败
      - name: 执行探针
        id: run
        working-directory: src/FluentFlyout.Lyrics.Probe
        run: dotnet run -c Release --no-build

      # 把 results.json 渲染成 step summary，评审人不必下载 artifact 就能看结论
      - name: 汇总到 Job Summary
        if: always()
        shell: pwsh
        run: |
          $json = Get-ChildItem -Recurse -Filter results.json -Path src/FluentFlyout.Lyrics.Probe/bin |
                  Select-Object -First 1
          if (-not $json) { "未找到 results.json"; exit 0 }
          $data = Get-Content $json.FullName -Raw -Encoding utf8 | ConvertFrom-Json
          "| 编号 | 检查项 | 结果 | 详情 |"      | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|"                      | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          foreach ($r in $data) {
            $icon = if ($r.pass) { 'PASS' } else { 'FAIL' }
            "| $($r.id) | $($r.name) | $icon | $($r.detail) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: 归档结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: src/FluentFlyout.Lyrics.Probe/bin/Release/**/results.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # J2：Core 移植门槛 —— 证明 TL.Core 能在 FF 的 TFM 下编译
  # 这是 P1 阶段能否开工的直接证据
  # ─────────────────────────────────────────────────────────────
  core-migration:
    name: J2 Core 移植 (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arm64: false
          - rid: win-arm64
            arm64: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ARM64 仅在手动触发且开关打开时执行，PR 场景跳过以省时间
      - name: 判定是否跳过
        id: skip
        shell: pwsh
        run: |
          $skip = '${{ matrix.arm64 }}' -eq 'true' -and '${{ github.event_name }}' -eq 'pull_request'
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: 还原
        if: steps.skip.outputs.skip != 'true'
        working-directory: src/FluentFlyout.Lyrics
        run: dotnet restore -r ${{ matrix.rid }}

      # -warnaserror 是硬门槛：本仓不允许带着任何警告通过
      # （NU1903 已在 csproj 中通过升级 EF Core 消除，见 docs/verification-report.md R9）
      - name: 编译 Core（警告视为错误）
        if: steps.skip.outputs.skip != 'true'
        working-directory: src/FluentFlyout.Lyrics
        run: dotnet build -c Release -r ${{ matrix.rid }} --no-restore -warnaserror

      # 依赖漏洞扫描：仅报告，不作为失败条件。
      # 理由：上游依赖新增 CVE 不应阻断与本次移植无关的 PR，
      # 但必须留下可追溯的记录。
      - name: 依赖漏洞扫描（仅报告）
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: true
        working-directory: src/FluentFlyout.Lyrics
        run: dotnet list package --vulnerable --include-transitive 2>&1 | Tee-Object -FilePath vuln-${{ matrix.rid }}.log

      - name: 归档漏洞报告
        if: always() && steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vuln-${{ matrix.rid }}
          path: src/FluentFlyout.Lyrics/vuln-${{ matrix.rid }}.log
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # J3：格式检查 —— 非阻断
  # 移植代码来自 TaskbarLyrics，风格与 FluentFlyout 未必一致，
  # 强制阻断会制造噪音；先只收集差异，P1 阶段再统一。
  # ─────────────────────────────────────────────────────────────
  format:
    name: J3 代码格式
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # dotnet-format 自 .NET 6 起已内置于 SDK，
      # 不要再 `dotnet tool install -g dotnet-format`（那是已废弃的独立工具，会冲突）
      - name: 检查格式
        working-directory: src
        continue-on-error: true
        run: dotnet format FluentFlyout.Lyrics/TaskbarLyrics.Core.csproj --verify-no-changes --severity warn